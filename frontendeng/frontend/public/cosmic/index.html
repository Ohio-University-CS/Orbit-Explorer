<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmic Events</title>

    <script type="module" crossorigin src="/cosmic/assets/index-CY4vSoL8.js"></script>
    <link rel="stylesheet" crossorigin href="/cosmic/assets/index-COpc0ASg.css" />
  </head>
  <body>
    <canvas id="bg"></canvas>

    <main>
      <!-- Temperature block -->
      <header>
        <h1>Cosmic Events</h1>
        <p>Scroll to Enter Inputs 👇</p>
      </header>

      <blockquote id="tempBlock">
        <form id="tempForm">
          <label for="temperature">Enter your temperature:</label><br /><br />
          <input
            type="number"
            id="temperature"
            name="temperature"
            placeholder="e.g. 36.6"
            required
          />
          <select id="unit" name="unit">
            <option value="C">°C</option>
            <option value="F">°F</option>
          </select>
          <button type="submit">Submit</button>
        </form>

        <p id="tempOutput"></p>
      </blockquote>

      <!-- Date block (not saved right now, just UI) -->
      <section>
        <h2>📅 Select a Date</h2>

        <form id="dateForm">
          <label for="eventDate">Choose a date:</label><br />
          <input type="date" id="eventDate" name="eventDate" required /><br /><br />

          <button type="submit">Submit</button>
        </form>

        <p id="dateOutput"></p>
      </section>

      <!-- Time block -->
      <section class="light">
        <h2>🕒 Your Local Time</h2>
        <div id="timeBlock">
          <div id="localTime" class="giant-time">--:--:--</div>
          <div id="localZone" class="zone-note">(Detecting timezone…)</div>
        </div>
      </section>

      <!-- Location detection block -->
      <blockquote>
        <h2>📍 Your Location</h2>

        <div id="locationBlock">
          <p id="locationStatus">Trying to detect your location…</p>
          <p id="locationCoords"></p>
          <button id="useLocationBtn" disabled>Use this location</button>
        </div>
      </blockquote>

      <!-- Manual coordinates block (these are the values we carry over) -->
      <section class="left">
        <h2>📍 Coordinates</h2>

        <form id="workForm">
          <label for="latitude">Latitude</label><br />
          <input type="text" id="latitude" name="latitude" /><br /><br />

          <label for="longitude">Longitude</label><br />
          <input type="text" id="longitude" name="longitude" /><br /><br />

          <button type="submit">Save</button>
        </form>

        <p id="formOutput"></p>
      </section>

      <!-- Final submit that jumps to /next -->
      <blockquote id="submitBlock">
        <button id="finalSubmit" type="button">Submit</button>
        <p id="submitMessage"></p>
      </blockquote>
    </main>

    <script>
      // Utilities
      function pad(n) {
        return String(n).padStart(2, "0");
      }

      // ---- Local time display ----
      (function setupClock() {
        const timeEl = document.getElementById("localTime");
        const zoneEl = document.getElementById("localZone");

        function tick() {
          const now = new Date();

          const h = now.getHours();
          const m = now.getMinutes();
          const s = now.getSeconds();

          let hour12 = h % 12;
          if (hour12 === 0) hour12 = 12;
          const ampm = h >= 12 ? "p.m." : "a.m.";

          timeEl.textContent =
            pad(hour12) + ":" + pad(m) + ":" + pad(s) + " " + ampm;

          const tz = Intl.DateTimeFormat(undefined, {
            timeZoneName: "short",
          }).formatToParts(now);
          const zonePart = tz.find((p) => p.type === "timeZoneName");
          zoneEl.textContent = zonePart ? zonePart.value : "";
        }

        tick();
        setInterval(tick, 1000);
      })();

      // ---- Location detection (does NOT auto-fill coordinates) ----
      (function setupLocation() {
        const statusEl = document.getElementById("locationStatus");
        const coordsEl = document.getElementById("locationCoords");
        const useBtn = document.getElementById("useLocationBtn");

        const latInput = document.getElementById("latitude");
        const lonInput = document.getElementById("longitude");
        const submitMsg = document.getElementById("submitMessage");

        let currentCoords = null;

        function setCoords(lat, lon, sourceText) {
          currentCoords = { lat, lon };

          coordsEl.textContent =
            "Latitude: " +
            lat.toFixed(4) +
            ", Longitude: " +
            lon.toFixed(4) +
            (sourceText ? " (" + sourceText + ")" : "");

          statusEl.textContent = "Location detected:";
          useBtn.disabled = false;
        }

        function tryIpFallback() {
          statusEl.textContent =
            "Could not get precise device location. Trying IP-based location…";

          fetch("https://ipapi.co/json/")
            .then((res) => res.json())
            .then((data) => {
              if (!data || data.latitude == null || data.longitude == null) {
                throw new Error("No coordinates in IP response");
              }

              const lat = parseFloat(data.latitude);
              const lon = parseFloat(data.longitude);
              const city = data.city || "";
              const country = data.country_name || "";

              let source = "approximate via IP";
              if (city || country) {
                source += " – " + [city, country].filter(Boolean).join(", ");
              }

              setCoords(lat, lon, source);
            })
            .catch((err) => {
              console.error("IP geolocation error:", err);
              statusEl.textContent =
                "Could not get your location automatically (device + IP both failed).";
              coordsEl.textContent =
                "You can still type coordinates manually in the form below.";
              useBtn.disabled = true;
            });
        }

        function geoSuccess(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          console.log("Browser geolocation success:", lat, lon);
          setCoords(lat, lon, "from browser (GPS / Wi-Fi)");
        }

        function geoError(error) {
          console.warn("Browser geolocation error:", error);
          tryIpFallback();
        }

        if ("geolocation" in navigator) {
          statusEl.textContent = "Trying to get your device location…";

          navigator.geolocation.getCurrentPosition(geoSuccess, geoError, {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0,
          });
        } else {
          statusEl.textContent =
            "Browser does not support geolocation. Using IP-based location…";
          tryIpFallback();
        }

        // Only when user clicks this do we copy into the coordinate inputs
        useBtn.addEventListener("click", function () {
          if (!currentCoords) return;

          latInput.value = currentCoords.lat.toFixed(6);
          lonInput.value = currentCoords.lon.toFixed(6);

          if (submitMsg) {
            submitMsg.textContent = "Location copied into the coordinates form.";
          }
        });
      })();

      // ---- Forms + localStorage wiring ----
      (function setupForms() {
        const tempForm = document.getElementById("tempForm");
        const tempInput = document.getElementById("temperature");
        const unitSelect = document.getElementById("unit");
        const tempOutput = document.getElementById("tempOutput");

        const workForm = document.getElementById("workForm");
        const latInput = document.getElementById("latitude");
        const lonInput = document.getElementById("longitude");
        const formOutput = document.getElementById("formOutput");

        const finalSubmitBtn = document.getElementById("finalSubmit");
        const submitMsg = document.getElementById("submitMessage");

        // Temperature form: save value + unit, but don't reload page
        tempForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const t = tempInput.value.trim();
          const u = unitSelect.value;

          if (!t) {
            tempOutput.textContent = "Please enter a temperature.";
            return;
          }

          localStorage.setItem("oe_temperature", t);
          localStorage.setItem("oe_tempUnit", u);
          tempOutput.textContent = "Saved temperature: " + t + " °" + u;
        });

        // Coordinate form: save lat/lon, don't reload page
        workForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const lat = latInput.value.trim();
          const lon = lonInput.value.trim();

          if (!lat || !lon) {
            formOutput.textContent = "Please enter both latitude and longitude.";
            return;
          }

          localStorage.setItem("oe_latitude", lat);
          localStorage.setItem("oe_longitude", lon);
          formOutput.textContent = "Saved coordinates: " + lat + ", " + lon;
        });

        // Final submit: snapshot current local time (EST for you), save last inputs, go to /next
        finalSubmitBtn.addEventListener("click", function () {
          const now = new Date();
          const localStart =
            now.getFullYear() +
            "-" +
            pad(now.getMonth() + 1) +
            "-" +
            pad(now.getDate()) +
            "T" +
            pad(now.getHours()) +
            ":" +
            pad(now.getMinutes());

          localStorage.setItem("oe_startTimeLocal", localStart);

          const lat = latInput.value.trim();
          const lon = lonInput.value.trim();
          if (lat) localStorage.setItem("oe_latitude", lat);
          if (lon) localStorage.setItem("oe_longitude", lon);

          const t = tempInput.value.trim();
          const u = unitSelect.value;
          if (t) {
            localStorage.setItem("oe_temperature", t);
            localStorage.setItem("oe_tempUnit", u);
          }

          submitMsg.textContent = "Inputs saved. Opening occultation search…";

          // Navigate to React /next route (OccultationSearch)
          window.location.href = "/next";
        });
      })();
    </script>
  </body>
</html>
